name: bug_handler
description: "Composable Flutter error-reporting toolkit with rich context providers, privacy sanitizers, and pluggable reporters."
version: 1.0.0-dev.2
homepage: https://github.com/omar-hanafy/bug_handler
repository: https://github.com/omar-hanafy/bug_handler
issue_tracker: https://github.com/omar-hanafy/bug_handler/issues
documentation: https://github.com/omar-hanafy/bug_handler#readme

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.1"

topics:
  - utilities
  - helpers
  - extensions
  - productivity
  - adaptive

platforms:
  android:
  ios:
  macos:
  linux:
  web:
  windows:

dependencies:
  async: ^2.13.1
  battery_plus: ^7.0.0
  connectivity_plus: ^7.1.1
  device_info_plus: ^13.0.0
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_helper_utils: ^8.5.0
  meta: ^1.17.0
  network_info_plus: ^8.0.0
  package_info_plus: ^10.0.0
  path_provider: ^2.1.5
  share_plus: ^13.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
